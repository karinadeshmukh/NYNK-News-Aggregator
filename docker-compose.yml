version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nynk_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nynk_network

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: nynk_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_PORT=8000
      - AI_SERVICE_HOST=0.0.0.0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=meta-llama/llama-3-8b-instruct:free
    networks:
      - nynk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nynk_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/nynk
      - AI_SERVICE_URL=http://ai_service:8000/api
      - JWT_SECRET=${JWT_SECRET:-nynk-prod-jwt-secret-2026}
    depends_on:
      - mongodb
      - ai_service
    networks:
      - nynk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nynk_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - nynk_network

networks:
  nynk_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local

